services:
  app:
    build: .
    container_name: crypto-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public&connection_limit=10"
      REDIS_URL: "redis://redis:6379"
      OTLP_TRACE_ENDPOINT: "http://tempo:4318/v1/traces"
      LOKI_HOST: "http://loki:3100"
    ports:
      - "3030:3030"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    container_name: crypto-frontend
    restart: unless-stopped
    ports:
      - "3005:3005"
    depends_on:
      - app

  db:
    image: postgres:15-alpine
    container_name: crypto-pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MONITORING_PASSWORD: ${MONITORING_PASSWORD}
    # pg_stat_statements must be loaded at server start (it cannot be enabled
    # with just CREATE EXTENSION), so it's preloaded here and installed into
    # the database by the init script below.
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "pg_stat_statements.max=10000"
      - "-c"
      - "track_io_timing=on"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d crypto_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: crypto-postgres-exporter
    restart: unless-stopped
    environment:
      # Dedicated read-only monitoring role (named "monitoring_user" - role
      # names starting with "pg_" are reserved by Postgres itself), not the
      # app's admin user - see postgres-init/02-monitoring-role.sql.
      DATA_SOURCE_NAME: "postgresql://monitoring_user:${MONITORING_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: "/etc/postgres-exporter/queries.yaml"
    volumes:
      - ./postgres-exporter-queries.yaml:/etc/postgres-exporter/queries.yaml:ro
    ports:
      - "9187:9187"
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: crypto-redis
    ports:
      - "6379:6379"

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: crypto-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
    ports:
      - "9121:9121"
    depends_on:
      - redis

  redis-client-monitor:
    build: ./redis-client-monitor
    container_name: crypto-redis-client-monitor
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # REDIS_USERNAME / REDIS_PASSWORD: set these if the redis service
      # below is configured with --requirepass / ACLs.
      POLL_INTERVAL_SECONDS: "5"
    ports:
      - "8001:8001"
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    container_name: crypto-prometheus
    volumes:
      - ./prometheus-config.yml:/etc/prometheus/prometheus.yml
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:latest
    container_name: crypto-alertmanager
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - "9093:9093"

  loki:
    image: grafana/loki:latest
    container_name: crypto-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  tempo:
    image: grafana/tempo:latest
    container_name: crypto-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo-config.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200"
      - "4318:4318" # OTLP HTTP receiver

  node-exporter:
    image: prom/node-exporter:latest
    container_name: crypto-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"

  grafana:
    image: grafana/grafana:latest
    container_name: crypto-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/crypto-dashboard.json
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/crypto-dashboard.json
      - ./redis-clients-dashboard.json:/var/lib/grafana/dashboards/redis-clients-dashboard.json
    depends_on:
      - redis-client-monitor


volumes:
  pgdata:
