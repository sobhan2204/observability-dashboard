groups:
  - name: app-alerts
    rules:
      - alert: HighRequestRate
        expr: sum by (route) (rate(http_requests_total[1m])) > 0.5
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "High request rate on {{ $labels.route }}"
          description: "Route {{ $labels.route }} is getting more than 0.5 req/s"

      - alert: InvalidEndpointHit
        expr: increase(http_requests_total{code="404"}[1m]) > 2
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "Invalid endpoint being hit repeatedly"
          description: "More than 2 invalid requests in the last minute"

      - alert: SlowEndpointLatency
        expr: sum by (route) (rate(http_request_duration_seconds_sum[1m])) / sum by (route) (rate(http_request_duration_seconds_count[1m])) > 0.5
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Slow endpoint latency is high on {{ $labels.route }}"
          description: "Average execution time exceeded 0.5s"
