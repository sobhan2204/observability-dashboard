# Custom queries for prometheuscommunity/postgres-exporter.
#
# Each top-level key becomes a metric name prefix: pg_<key>_<column>.
# Query text is never exposed as a raw metric VALUE - pg_stat_statements
# already parameterizes literals out of the query text (?, $1, ...), and every
# query here is additionally regexp-whitespace-normalized and truncated to
# bound label size. Result sets are capped (LIMIT / "only if long-running" /
# "only if blocked") specifically to keep Prometheus label-set cardinality
# bounded - none of these should produce more than a few dozen series.

pg_stat_statements:
  query: |
    SELECT
      queryid::text AS queryid,
      left(regexp_replace(query, '\s+', ' ', 'g'), 200) AS query,
      calls,
      round(total_exec_time::numeric, 3) AS total_exec_time_ms,
      round(mean_exec_time::numeric, 3) AS mean_exec_time_ms,
      rows,
      shared_blks_hit,
      shared_blks_read,
      temp_blks_written,
      temp_blks_read,
      coalesce(wal_bytes, 0) AS wal_bytes
    FROM pg_stat_statements
    WHERE query NOT ILIKE '%pg_stat_statements%'
    ORDER BY total_exec_time DESC
    LIMIT 50
  metrics:
    - queryid:
        usage: "LABEL"
        description: "Stable hash identifying a normalized query shape (fingerprint)"
    - query:
        usage: "LABEL"
        description: "Normalized query text, truncated to 200 chars (no literal parameter values)"
    - calls:
        usage: "COUNTER"
        description: "Number of times this query shape has been executed"
    - total_exec_time_ms:
        usage: "COUNTER"
        description: "Cumulative execution time in milliseconds across all calls"
    - mean_exec_time_ms:
        usage: "GAUGE"
        description: "Mean execution time in milliseconds per call"
    - rows:
        usage: "COUNTER"
        description: "Total rows returned or affected"
    - shared_blks_hit:
        usage: "COUNTER"
        description: "Shared buffer blocks found already in cache (cache hit)"
    - shared_blks_read:
        usage: "COUNTER"
        description: "Shared buffer blocks read from disk (cache miss)"
    - temp_blks_written:
        usage: "COUNTER"
        description: "Temp file blocks written (query spilled to disk, e.g. sort/hash overflow)"
    - temp_blks_read:
        usage: "COUNTER"
        description: "Temp file blocks read back"
    - wal_bytes:
        usage: "COUNTER"
        description: "WAL bytes generated by this query shape"

# NOTE: wait-event breakdown and per-state backend counts are NOT defined as
# custom queries here - postgres_exporter already ships a built-in
# `pg_stat_activity_count` collector (labels: datname, state, usename,
# application_name, backend_type, wait_event_type, wait_event) that covers
# both. A custom query of the same shape was tried and collides with it
# (duplicate metric registration -> the exporter's /metrics endpoint fails
# entirely), so both the Wait Event Distribution and Database Health Score
# panels query the built-in pg_stat_activity_count metric directly instead.

pg_locks_waiting:
  query: |
    SELECT count(*) AS total
    FROM pg_locks
    WHERE NOT granted
  metrics:
    - total:
        usage: "GAUGE"
        description: "Number of lock requests currently waiting to be granted (blocked sessions)"

pg_blocking_sessions:
  query: |
    SELECT
      a.pid AS blocked_pid,
      bpid AS blocking_pid,
      a.datname AS database,
      a.usename AS blocked_user,
      a.application_name AS application,
      extract(epoch FROM (now() - a.query_start))::float AS duration_seconds,
      left(regexp_replace(a.query, '\s+', ' ', 'g'), 150) AS blocked_query,
      left(regexp_replace(b.query, '\s+', ' ', 'g'), 150) AS blocking_query
    FROM pg_stat_activity a
    CROSS JOIN LATERAL unnest(pg_blocking_pids(a.pid)) AS bpid
    JOIN pg_stat_activity b ON b.pid = bpid
    WHERE cardinality(pg_blocking_pids(a.pid)) > 0
  metrics:
    - blocked_pid:
        usage: "LABEL"
        description: "PID of the session waiting on a lock"
    - blocking_pid:
        usage: "LABEL"
        description: "PID of the session holding the lock"
    - database:
        usage: "LABEL"
        description: "Database name"
    - blocked_user:
        usage: "LABEL"
        description: "User of the blocked session"
    - application:
        usage: "LABEL"
        description: "Application name of the blocked session"
    - blocked_query:
        usage: "LABEL"
        description: "Normalized query text of the blocked session, truncated to 150 chars"
    - blocking_query:
        usage: "LABEL"
        description: "Normalized query text of the blocking session, truncated to 150 chars"
    - duration_seconds:
        usage: "GAUGE"
        description: "How long the blocked session has been waiting, in seconds"

pg_running_queries:
  # No time threshold here on purpose: this single metric backs both the
  # "Running Queries" panel (unfiltered) and the "Long Running Queries" panel
  # (same metric with a `> 30` PromQL filter), so there's one query to
  # maintain instead of two near-duplicates.
  query: |
    SELECT
      pid::text AS pid,
      datname AS database,
      usename AS "user",
      application_name AS application,
      state,
      extract(epoch FROM (now() - query_start))::float AS duration_seconds,
      left(regexp_replace(query, '\s+', ' ', 'g'), 150) AS query
    FROM pg_stat_activity
    WHERE state != 'idle'
      AND query_start IS NOT NULL
      AND pid <> pg_backend_pid()
  metrics:
    - pid:
        usage: "LABEL"
        description: "Backend process ID"
    - database:
        usage: "LABEL"
        description: "Database name"
    - user:
        usage: "LABEL"
        description: "Session user"
    - application:
        usage: "LABEL"
        description: "Application name reported by the client"
    - state:
        usage: "LABEL"
        description: "Backend state (active, idle in transaction, ...)"
    - query:
        usage: "LABEL"
        description: "Normalized query text, truncated to 150 chars"
    - duration_seconds:
        usage: "GAUGE"
        description: "How long the query has been running, in seconds"

# NOTE: no custom pg_bgwriter query - postgres_exporter's built-in collector
# already exposes pg_stat_bgwriter_checkpoints_timed_total,
# checkpoints_req_total, buffers_checkpoint_total, buffers_clean_total and
# buffers_backend_total, confirmed present on this exporter version/build.

pg_wal:
  query: |
    SELECT wal_records, wal_bytes, wal_buffers_full
    FROM pg_stat_wal
  metrics:
    - wal_records:
        usage: "COUNTER"
        description: "Total WAL records generated"
    - wal_bytes:
        usage: "COUNTER"
        description: "Total WAL bytes generated"
    - wal_buffers_full:
        usage: "COUNTER"
        description: "Times WAL data was written to disk because WAL buffers were full"
